<!--
  Add this button anywhere in your itinerary_template.html, ideally near
  the top (e.g. inside your header/hero section).

  Clicking it opens the browser's native print dialog with
  "Save as PDF" as a destination option — no server, no Python
  library, no install required.
-->

<button id="download-pdf-btn" onclick="window.print()">
  Download as PDF
</button>

<style>
  #download-pdf-btn {
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #1a1a1a;
    color: #fff;
  }
  #download-pdf-btn:hover {
    opacity: 0.85;
  }

  /* Hide the button itself when the print dialog renders the page,
     and clean up the layout for a print-friendly look. */
  @media print {
    #download-pdf-btn {
      display: none;
    }
    body {
      /* avoid cutting sections across page breaks awkwardly */
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .day-section, .beat {
      break-inside: avoid;
    }
  }
</style>
