<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Itinerary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#242018; --ink-soft:#4a4438; --paper:#f1ead9; --paper-deep:#e7ddc6;
    --indigo:#2c4a6e; --indigo-deep:#1c3350; --maple:#a8402e; --gold:#b6902c;
    --line: rgba(36,32,24,0.16); --shadow: 0 18px 40px rgba(28,25,18,0.14);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:radial-gradient(ellipse at top left, rgba(182,144,44,0.06), transparent 45%),radial-gradient(ellipse at bottom right, rgba(44,74,110,0.07), transparent 50%),var(--paper);color:var(--ink);font-family:'Noto Sans JP', sans-serif;font-weight:300;line-height:1.65;-webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}}
  ::selection{background:var(--gold);color:var(--paper);}
  img{max-width:100%;display:block;}
  .scroll-rail{position:fixed;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--indigo) 0%,var(--maple) 50%,var(--gold) 100%);z-index:50;}

  .hero{position:relative;min-height:92vh;display:flex;flex-direction:column;justify-content:flex-end;padding:8vh 8vw 8vh;overflow:hidden;}
  .hero-bg{position:absolute;inset:0;z-index:0;}
  .hero-bg img{width:100%;height:100%;object-fit:cover;}
  .hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(28,25,18,0.15) 0%, rgba(28,25,18,0.55) 65%, var(--paper) 100%);}
  .hero:not(.has-image){min-height:92vh;justify-content:center;background:linear-gradient(180deg, rgba(241,234,217,0) 0%, var(--paper) 92%),repeating-linear-gradient(115deg, rgba(36,32,24,0.025) 0px, rgba(36,32,24,0.025) 1px, transparent 1px, transparent 14px);}
  .hero-content{position:relative;z-index:1;}
  .hero.has-image .eyebrow, .hero.has-image .hero-sub, .hero.has-image .hero-facts dt{color:rgba(241,234,217,0.85);}
  .hero.has-image h1.hero-title{color:var(--paper);}
  .hero.has-image .hero-facts dd{color:var(--paper);}
  .hero-mark{position:absolute;top:6vh;right:6vw;z-index:2;width:120px;height:120px;border:2.5px solid var(--maple);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--maple);background:rgba(241,234,217,0.9);font-family:'Shippori Mincho', serif;font-size:2.4rem;font-weight:800;transform:rotate(4deg);opacity:0.95;animation:seal-drop 900ms cubic-bezier(.2,.8,.2,1) both;}
  @keyframes seal-drop{from{opacity:0;transform:rotate(4deg) translateY(-14px) scale(0.9);}to{opacity:0.95;transform:rotate(4deg) translateY(0) scale(1);}}
  .eyebrow{font-family:'JetBrains Mono', monospace;letter-spacing:0.22em;text-transform:uppercase;font-size:0.72rem;color:var(--indigo-deep);margin:0 0 1.6rem;}
  .eyebrow::before{content:"◆ ";color:var(--gold);}
  h1.hero-title{font-family:'Shippori Mincho', serif;font-weight:800;font-size:clamp(2.6rem, 8vw, 6rem);line-height:1.0;margin:0 0 1.4rem;max-width:16ch;}
  h1.hero-title em{font-style:normal;color:var(--maple);}
  .hero-sub{max-width:46ch;font-size:1.06rem;color:var(--ink-soft);margin:0 0 3rem;}
  .hero-facts{display:flex;flex-wrap:wrap;gap:2.2rem 3.2rem;font-family:'JetBrains Mono', monospace;font-size:0.86rem;list-style:none;padding:0;margin:0;}
  .hero-facts dt{color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.12em;font-size:0.68rem;margin-bottom:0.3rem;}
  .hero-facts dd{margin:0;font-size:1rem;color:var(--ink);}

  section{padding:6.5rem 8vw;position:relative;border-top:1px solid var(--line);}
  .section-head{display:flex;align-items:baseline;gap:1.4rem;margin-bottom:3rem;}
  .section-head .kanji{font-family:'Shippori Mincho', serif;font-size:2.1rem;color:var(--indigo);font-weight:600;}
  .section-head h2{font-family:'Shippori Mincho', serif;font-size:clamp(1.9rem,3.4vw,2.6rem);font-weight:600;margin:0;}
  .section-head .line{flex:1;height:1px;background:var(--line);}

  .overview-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:2.2rem 2.6rem;}
  .ov-item{border-left:2px solid var(--paper-deep);padding-left:1.1rem;}
  .ov-item.accent{border-left-color:var(--maple);}
  .ov-item h3{font-family:'JetBrains Mono', monospace;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--ink-soft);margin:0 0 0.5rem;font-weight:500;}
  .ov-item p{margin:0;font-size:1.02rem;}

  .day{padding:3.6rem 0;border-top:1px solid var(--line);}
  .day:first-of-type{border-top:none;}
  .day-cover{width:100%;aspect-ratio:16/6;border-radius:3px;overflow:hidden;margin-bottom:1.8rem;box-shadow:var(--shadow);position:relative;}
  .day-cover img{width:100%;height:100%;object-fit:cover;}
  .day-header{display:grid;grid-template-columns:120px 1fr;gap:0 3rem;}
  .day-mark{position:relative;}
  .day-seal{width:76px;height:76px;border:2px solid var(--maple);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--maple);font-family:'Shippori Mincho', serif;}
  .day-seal .num{font-size:1.6rem;font-weight:800;line-height:1;}
  .day-seal .lbl{font-family:'JetBrains Mono', monospace;font-size:0.55rem;letter-spacing:0.08em;margin-top:2px;}
  .day-theme{font-family:'JetBrains Mono', monospace;font-size:0.72rem;color:var(--indigo-deep);letter-spacing:0.08em;margin-top:0.9rem;writing-mode:vertical-rl;text-orientation:mixed;display:inline-block;}
  .day-title{font-family:'Shippori Mincho', serif;font-size:clamp(1.5rem,2.4vw,1.9rem);font-weight:600;margin:0 0 1.6rem;}
  .beats{display:flex;flex-direction:column;}
  .beat{display:grid;grid-template-columns:76px 1fr auto;gap:1.2rem;padding:0.9rem 0;border-top:1px dashed var(--line);align-items:start;}
  .beat:first-child{border-top:none;}
  .beat time{font-family:'JetBrains Mono', monospace;font-size:0.78rem;color:var(--indigo);padding-top:0.1rem;}
  .beat .beat-kind{display:block;font-family:'JetBrains Mono', monospace;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--gold);margin-bottom:0.2rem;}
  .beat p{margin:0 0 0.3rem;font-size:0.98rem;}
  .beat .beat-meta{font-family:'JetBrains Mono', monospace;font-size:0.72rem;color:var(--ink-soft);}
  .beat .beat-meta span + span::before{content:" · ";}
  .beat-thumb{width:64px;height:64px;border-radius:3px;overflow:hidden;flex-shrink:0;}
  .beat-thumb img{width:100%;height:100%;object-fit:cover;}
  .day-tip{margin-top:1.6rem;padding:1.1rem 1.4rem;background:rgba(44,74,110,0.06);border-left:2px solid var(--indigo);font-size:0.92rem;color:var(--ink-soft);}
  .day-tip strong{color:var(--indigo-deep);font-weight:500;}

  .gallery-strip{display:flex;gap:0.9rem;overflow-x:auto;margin-top:1.8rem;padding-bottom:0.4rem;scrollbar-width:thin;}
  .gallery-strip figure{margin:0;flex:0 0 auto;width:220px;}
  .gallery-strip img{width:220px;height:150px;object-fit:cover;border-radius:3px;}
  .gallery-strip figcaption{font-family:'JetBrains Mono', monospace;font-size:0.68rem;color:var(--ink-soft);margin-top:0.4rem;}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(250px,1fr));gap:1.6rem;}
  .card{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:3px;overflow:hidden;position:relative;}
  .card-img{width:100%;aspect-ratio:4/3;overflow:hidden;}
  .card-img img{width:100%;height:100%;object-fit:cover;}
  .card-body{padding:1.5rem 1.5rem 1.6rem;position:relative;}
  .card-body::before{content:"";position:absolute;top:0;left:1.5rem;width:28px;height:3px;background:var(--maple);}
  .card h3{font-family:'Shippori Mincho', serif;font-size:1.02rem;font-weight:600;margin:0.7rem 0 0.6rem;}
  .card p{margin:0;font-size:0.94rem;color:var(--ink-soft);}
  .card .price{font-family:'JetBrains Mono', monospace;font-size:0.75rem;color:var(--gold);}
  .card .meta-row{display:flex;gap:0.9rem;margin-top:0.7rem;font-family:'JetBrains Mono', monospace;font-size:0.72rem;color:var(--indigo-deep);flex-wrap:wrap;}
  .card a.book-link{display:inline-block;margin-top:0.9rem;font-family:'JetBrains Mono', monospace;font-size:0.72rem;color:var(--indigo);border-bottom:1px solid var(--indigo);text-decoration:none;}

  .budget-list{display:flex;flex-direction:column;max-width:720px;}
  .budget-row{display:flex;justify-content:space-between;align-items:baseline;padding:1rem 0;border-top:1px solid var(--line);}
  .budget-row:first-child{border-top:none;}
  .budget-row .label{font-size:0.98rem;}
  .budget-row .value{font-family:'JetBrains Mono', monospace;font-size:0.95rem;color:var(--indigo-deep);}
  .budget-row.total{margin-top:0.6rem;padding-top:1.4rem;border-top:2px solid var(--ink);}
  .budget-row.total .label, .budget-row.total .value{font-weight:700;font-size:1.15rem;color:var(--maple);}
  .budget-note{margin-top:1.4rem;color:var(--ink-soft);font-size:0.92rem;max-width:60ch;}

  .tips-list{list-style:none;margin:0;padding:0;display:grid;gap:1.4rem;max-width:820px;}
  .tips-list li{display:grid;grid-template-columns:64px 150px 1fr;gap:1.2rem;padding:1rem 0;border-top:1px dashed var(--line);align-items:center;}
  .tips-list li.no-image{grid-template-columns:150px 1fr;}
  .tips-list li:first-child{border-top:none;}
  .tips-list .k{font-family:'JetBrains Mono', monospace;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--indigo);}
  .tip-thumb{width:64px;height:64px;border-radius:50%;overflow:hidden;}
  .tip-thumb img{width:100%;height:100%;object-fit:cover;}

  footer{padding:4rem 8vw 5rem;text-align:center;font-family:'JetBrains Mono', monospace;font-size:0.72rem;color:var(--ink-soft);letter-spacing:0.08em;}
  .load-state{padding:10rem 8vw;text-align:center;font-family:'JetBrains Mono', monospace;color:var(--ink-soft);}

  @media (max-width: 760px){
    .overview-grid{grid-template-columns:1fr 1fr;}
    .day-header{grid-template-columns:64px 1fr;gap:0 1.4rem;}
    .day-seal{width:56px;height:56px;}
    .day-seal .num{font-size:1.15rem;}
    .day-theme{display:none;}
    .beat{grid-template-columns:60px 1fr;}
    .beat-thumb{display:none;}
    section{padding:4.5rem 6vw;}
    .hero{padding:12vh 6vw 6vh;}
    .hero-mark{width:80px;height:80px;font-size:1.6rem;top:4vh;right:5vw;}
    .tips-list li{grid-template-columns:48px 1fr;}
    .tips-list li.no-image{grid-template-columns:1fr;}
  }
  @media (max-width: 520px){
    .overview-grid{grid-template-columns:1fr;}
  }
</style>

ed on weather and other factors."};</script>

<body>

<div class="scroll-rail" aria-hidden="true"></div>
<main id="app">
  <div class="load-state">Loading itinerary…</div>
</main>

<script>
async function loadItineraryData(){
  if (window.ITINERARY_DATA) return window.ITINERARY_DATA;
  const res = await fetch('itinerary.json');
  if (!res.ok) throw new Error('Failed to load itinerary.json (' + res.status + ')');
  return res.json();
}

function img(image, className){
  if (!image || !image.url) return '';
  const alt = (image.alt || '').replace(/"/g, '&quot;');
  return `<img src="${image.url}" alt="${alt}" loading="lazy" class="${className || ''}">`;
}

function renderHero(data){
  const h = data.hero;
  const facts = (h.facts || []).map(f => `<div><dt>${f.label}</dt><dd>${f.value}</dd></div>`).join('');
  const hasImage = h.image && h.image.url;
  return `
  <header class="hero ${hasImage ? 'has-image' : ''}">
    ${hasImage ? `<div class="hero-bg">${img(h.image)}</div>` : ''}
    <div class="hero-mark" aria-hidden="true">${data.heroMark || '旅'}</div>
    <div class="hero-content">
      <p class="eyebrow">${h.eyebrow}</p>
      <h1 class="hero-title">${h.titleHtml}</h1>
      <p class="hero-sub">${h.subtitle}</p>
      <dl class="hero-facts">${facts}</dl>
    </div>
  </header>`;
}

function renderOverview(data){
  const items = (data.overview || []).map(o =>
    `<div class="ov-item ${o.accent ? 'accent' : ''}"><h3>${o.label}</h3><p>${o.value}</p></div>`
  ).join('');
  return `
  <section id="overview">
    <div class="section-head"><span class="kanji">概</span><h2>Trip Overview</h2><span class="line"></span></div>
    <div class="overview-grid">${items}</div>
  </section>`;
}

function renderDays(data){
  const days = (data.days || []).map(d => {
    const beats = (d.beats || []).map(b => {
      const meta = [];
      if (b.durationMinutes) meta.push(`${b.durationMinutes} min`);
      if (b.cost) meta.push(b.cost);
      if (b.location && b.location.name) meta.push(b.location.name);
      const thumb = b.image ? `<div class="beat-thumb">${img(b.image)}</div>` : '<span></span>';
      return `<div class="beat">
        <time>${b.time}</time>
        <div><span class="beat-kind">${b.kind}</span><p>${b.text}</p>${meta.length ? `<div class="beat-meta">${meta.map(m=>`<span>${m}</span>`).join('')}</div>` : ''}</div>
        ${thumb}
      </div>`;
    }).join('');

    const gallery = (d.gallery && d.gallery.length)
      ? `<div class="gallery-strip">${d.gallery.map(g => `<figure>${img(g)}<figcaption>${g.caption || ''}</figcaption></figure>`).join('')}</div>`
      : '';

    const cover = d.coverImage ? `<div class="day-cover">${img(d.coverImage)}</div>` : '';

    return `
    <article class="day">
      ${cover}
      <div class="day-header">
        <div class="day-mark">
          <div class="day-seal"><span class="num">${String(d.number).padStart(2,'0')}</span><span class="lbl">DAY</span></div>
          <span class="day-theme">${d.theme || ''}</span>
        </div>
        <div>
          <h3 class="day-title">${d.title}${d.date ? ` <span style="font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--ink-soft);font-weight:400;">— ${d.date}</span>` : ''}</h3>
          <div class="beats">${beats}</div>
          ${d.tip ? `<div class="day-tip"><strong>Daily tip —</strong> ${d.tip}</div>` : ''}
          ${gallery}
        </div>
      </div>
    </article>`;
  }).join('');
  return `
  <section id="timeline">
    <div class="section-head"><span class="kanji">程</span><h2>Timeline</h2><span class="line"></span></div>
    ${days}
  </section>`;
}

function renderCardSection(id, kanji, title, cards){
  const items = (cards || []).map(c => {
    const meta = [];
    if (c.rating) meta.push(`★ ${c.rating}`);
    if (c.cuisine) meta.push(c.cuisine);
    if (c.priceLevel) meta.push(c.priceLevel);
    if (c.address) meta.push(c.address);
    return `<div class="card">
      ${c.image ? `<div class="card-img">${img(c.image)}</div>` : ''}
      <div class="card-body">
        ${c.price ? `<span class="price">${c.price}</span>` : ''}
        <h3>${c.title}</h3>
        <p>${c.text}</p>
        ${meta.length ? `<div class="meta-row">${meta.map(m=>`<span>${m}</span>`).join('')}</div>` : ''}
        ${c.bookingUrl ? `<a class="book-link" href="${c.bookingUrl}" target="_blank" rel="noopener">View / Book →</a>` : ''}
      </div>
    </div>`;
  }).join('');
  return `
  <section id="${id}">
    <div class="section-head"><span class="kanji">${kanji}</span><h2>${title}</h2><span class="line"></span></div>
    <div class="card-grid">${items}</div>
  </section>`;
}

function renderBudget(data){
  const b = data.budget || {};
  const rows = (b.rows || []).map(r =>
    `<div class="budget-row"><span class="label">${r.label}</span><span class="value">${r.value}</span></div>`
  ).join('');
  const total = b.total
    ? `<div class="budget-row total"><span class="label">${b.total.label}</span><span class="value">${b.total.value}</span></div>`
    : '';
  return `
  <section id="budget">
    <div class="section-head"><span class="kanji">予</span><h2>Budget</h2><span class="line"></span></div>
    <div class="budget-list">${rows}${total}</div>
    ${b.note ? `<p class="budget-note">${b.note}</p>` : ''}
  </section>`;
}

function renderTips(data){
  const items = (data.tips || []).map(t =>
    `<li class="${t.image ? '' : 'no-image'}">
      ${t.image ? `<div class="tip-thumb">${img(t.image)}</div>` : ''}
      <span class="k">${t.key}</span><p>${t.text}</p>
    </li>`
  ).join('');
  return `
  <section id="tips">
    <div class="section-head"><span class="kanji">知</span><h2>Local Tips</h2><span class="line"></span></div>
    <ul class="tips-list">${items}</ul>
  </section>`;
}

function render(data){
  document.title = data.destination ? `${data.destination} Itinerary` : 'Itinerary';
  const parts = [
    renderHero(data),
    renderOverview(data),
    renderDays(data),
    renderCardSection('hotels', '宿', 'Hotels', data.hotels),
    renderCardSection('restaurants', '食', 'Restaurants', data.restaurants),
    renderCardSection('transport', '交', 'Transportation', data.transport),
    renderBudget(data),
    renderCardSection('packing', '荷', 'Packing', data.packing),
    renderTips(data),
    `<footer>${data.footer || 'Prepared as a field itinerary'}</footer>`
  ];
  document.getElementById('app').innerHTML = parts.join('\n');
}

loadItineraryData()
  .then(render)
  .catch(err => {
    document.getElementById('app').innerHTML =
      `<div class="load-state">Couldn't load itinerary data.<br>${err.message}</div>`;
    console.error(err);
  });
</script>
</body>
</html>
